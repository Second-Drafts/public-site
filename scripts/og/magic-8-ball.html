<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Josefin Sans";
				font-weight: 300 700;
				src: url(../../brand/fonts/josefin-sans.woff2);
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				background: radial-gradient(ellipse 60% 70% at 50% 42%, #1b2233 0%, #0a0d14 60%, #000 100%);
				color: #fff;
				position: relative;
				overflow: clip;
			}
			.ball {
				position: absolute;
				left: 50%;
				top: 22px;
				width: 480px;
				height: 480px;
				margin-left: -240px;
				border-radius: 50%;
				background: radial-gradient(circle at 33% 26%, #4a4f5c 0%, #1a1d25 16%, #07080b 46%, #000 100%);
				box-shadow:
					0 40px 90px rgba(0, 0, 0, 0.85),
					0 0 120px rgba(60, 110, 255, 0.18);
			}
			.ball::after {
				content: "";
				position: absolute;
				left: 17%;
				top: 6%;
				width: 34%;
				height: 17%;
				border-radius: 50%;
				background: radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 70%);
				transform: rotate(-28deg);
			}
			.window {
				position: absolute;
				left: 50%;
				top: 52%;
				width: 232px;
				height: 232px;
				margin: -116px 0 0 -116px;
				border-radius: 50%;
				background: radial-gradient(circle at 50% 40%, #0b1a5a 0%, #05103a 60%, #02061c 100%);
				border: 8px solid #0d0f15;
				box-shadow:
					inset 0 0 40px rgba(0, 0, 0, 0.9),
					0 0 0 3px #1d212b,
					0 0 30px rgba(70, 120, 255, 0.35);
				overflow: hidden;
			}
			.window svg {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
			.window::after {
				content: "";
				position: absolute;
				left: 14%;
				top: 6%;
				width: 46%;
				height: 24%;
				border-radius: 50%;
				background: radial-gradient(ellipse, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 70%);
			}
			.strip {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 116px;
				background: #111;
				border-top: 2px solid #2a2a2a;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 56px;
			}
			.cap {
				white-space: nowrap;
				font-family: "Josefin Sans", sans-serif;
				font-weight: 600;
				font-size: 32px;
				padding-top: 4px;
			}
			.cap span {
				color: #ffd400;
				margin: 0 0.35em;
			}
			.strip img {
				height: 40px;
				width: 475px;
				flex: none;
			}
		</style>
	</head>
	<body>
		<div class="ball">
			<div class="window">
				<svg viewBox="0 0 200 200" aria-hidden="true">
					<defs>
						<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
							<feGaussianBlur stdDeviation="6" result="blur" />
							<feMerge>
								<feMergeNode in="blur" />
								<feMergeNode in="SourceGraphic" />
							</feMerge>
						</filter>
					</defs>
					<polygon points="100,26 176,150 24,150" fill="#2a4fd6" filter="url(#glow)" />
					<polygon points="100,26 176,150 24,150" fill="#3f6cff" opacity="0.7" />
					<g font-family="'Josefin Sans', sans-serif" font-weight="700" font-size="15" fill="#fff" text-anchor="middle">
						<text x="100" y="86">SIGNS</text>
						<text x="100" y="106">POINT</text>
						<text x="100" y="126">TO YES</text>
					</g>
				</svg>
			</div>
		</div>
		<div class="strip">
			<div class="cap">Magic 8 Ball<span>·</span>Free online</div>
			<img src="../../brand/logos/sd-word-single_line-marked-night.svg" alt="" />
		</div>
	</body>
</html>
