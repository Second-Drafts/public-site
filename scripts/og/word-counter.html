<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Inter;
				font-weight: 700;
				src: url(../../public/fonts/inter-700.woff2);
			}
			@font-face {
				font-family: "Josefin Sans";
				font-weight: 300 700;
				src: url(../../brand/fonts/josefin-sans.woff2);
			}
			@font-face {
				font-family: "JetBrains Mono";
				font-weight: 700;
				src: url(../../public/fonts/jetbrains-mono-700.woff2);
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				background: #000;
				color: #fff;
				font-family: Inter, sans-serif;
				position: relative;
				overflow: clip;
			}
			.strip {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 116px;
				background: #111;
				border-top: 2px solid #2a2a2a;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 56px;
			}
			.cap {
				white-space: nowrap;
				font-family: "Josefin Sans", sans-serif;
				font-weight: 600;
				font-size: 32px;
				color: #fff;
				padding-top: 4px;
			}
			.cap span {
				color: #ffd400;
				margin: 0 0.35em;
			}
			.strip img {
				height: 40px;
				width: 475px;
				flex: none;
			}
			.stage {
				position: absolute;
				left: 100px;
				right: 100px;
				top: 70px;
				font-family: "JetBrains Mono", monospace;
				font-weight: 700;
			}
			.count {
				font-size: 190px;
				line-height: 200px;
			}
			.count small {
				font-size: 56px;
				color: #888;
				margin-left: 20px;
			}
			.meta {
				font-size: 44px;
				line-height: 64px;
				color: #ffd400;
			}
			.cut {
				margin-top: 24px;
				font-size: 40px;
				line-height: 56px;
				color: #888;
			}
			.cut s {
				text-decoration: underline 4px #e5484d;
				text-decoration-line: underline;
				color: #fff;
				background: rgba(229, 72, 77, 0.22);
			}
		</style>
	</head>
	<body>
		<div class="stage">
			<div class="count">712<small>words</small></div>
			<div class="meta">About 5 min aloud</div>
			<div class="cut">at most 650 · <s>62 words to cut</s></div>
		</div>
		<div class="strip">
			<div class="cap">Free word counter<span>·</span>Speaking time</div>
			<img src="../../brand/logos/sd-word-single_line-marked-night.svg" alt="" />
		</div>
	</body>
</html>
