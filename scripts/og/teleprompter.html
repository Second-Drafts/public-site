<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Josefin+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#000;color:#FFD400;font-family:Inter,sans-serif;position:relative;overflow:clip}
.text{position:absolute;left:100px;right:100px;top:106px;font-weight:700;font-size:72px;line-height:112px;white-space:nowrap}
.text p{opacity:.38}
.text p.read{opacity:1}
.band{position:absolute;left:0;right:0;top:218px;height:112px;background:rgba(255,212,0,.14);border-block:2px solid rgba(255,212,0,.5)}
.arrow{position:absolute;left:36px;top:258px;width:0;height:0;border-block:16px solid transparent;border-left:26px solid #FFD400}
.arrow.r{left:auto;right:36px;border-left:0;border-right:26px solid #FFD400}
.strip{position:absolute;left:0;right:0;bottom:0;height:116px;background:#111;border-top:2px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 56px}
.cap{white-space:nowrap;font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:34px;color:#fff;padding-top:4px}
.cap span{color:#FFD400;margin:0 .35em}
.strip img{height:40px;width:475px;flex:none}
</style></head><body>
<div class="band"></div><div class="arrow"></div><div class="arrow r"></div>
<div class="text"><p>Pick a font you can read,</p><p class="read">a colour to suit the room,</p><p>and say it like you mean it.</p></div>
<div class="strip"><div class="cap">Free teleprompter<span>·</span>No sign-up</div><img src="../../public/img/sd-word-single_line-marked-night.svg" alt=""></div>
</body></html>
