<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Josefin Sans";
				font-weight: 300 700;
				src: url(../../brand/fonts/josefin-sans.woff2);
			}
			@font-face {
				font-family: Literata;
				font-weight: 200 900;
				src: url(../../brand/fonts/literata.woff2);
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				background: #fbf9f3;
				color: #000;
				position: relative;
				overflow: clip;
			}
			h1 {
				position: absolute;
				left: 100px;
				right: 100px;
				top: 130px;
				font-family: "Josefin Sans", sans-serif;
				font-weight: 600;
				font-size: 116px;
				line-height: 132px;
			}
			.struck {
				position: relative;
				display: inline-block;
			}
			.struck svg {
				position: absolute;
				left: -6px;
				top: 54%;
				width: calc(100% + 12px);
				height: 28px;
				overflow: visible;
			}
			.strip {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 116px;
				border-top: 2px solid #e3dfd2;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 100px;
			}
			.cap {
				font-family: Literata, serif;
				font-size: 30px;
				white-space: nowrap;
				color: #55514a;
			}
			.strip img {
				height: 40px;
				width: 475px;
				flex: none;
			}
		</style>
	</head>
	<body>
		<h1>
			Your
			<span class="struck"
				>first<svg viewBox="0 0 100 12" preserveAspectRatio="none">
					<path
						d="M0 7 C 30 5, 66 6, 100 4"
						fill="none"
						stroke="#c22d22"
						stroke-width="6"
						stroke-linecap="round"
						vector-effect="non-scaling-stroke"
					/></svg
			></span>
			second draft starts here.
		</h1>
		<div class="strip">
			<div class="cap">Free tools for writers</div>
			<img src="../../brand/logos/sd-word-single_line-marked.svg" alt="" />
		</div>
	</body>
</html>
