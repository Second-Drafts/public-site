<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Department of Second Drafts: Word Counter</title><style>:root{--color-primary:#222;--color-background:#fffdfd}@media (prefers-color-scheme:dark){:root{--color-primary:#fff;--color-background:#222}}body{color:var(--color-primary);background:var(--color-background);font-size:1.2rem;line-height:1.8}
</style></head><body><main style="max-width: 600px; margin: 4rem auto"><h1 style="text-align: center">Word Counter</h1><p label-for="input">Type or paste some text to quickly check its word count</p><textarea id="input" rows="10" style="width: 100%"></textarea><p><span id="count">0</span> words</p></main></body></html><script type="module">var e=document.querySelector(`#input`),t=document.querySelector(`#count`),n=e=>e.split(/\s+/).filter(Boolean).length;e?.addEventListener(`input`,()=>{t&&(t.textContent=String(n(e.value)))});</script>
