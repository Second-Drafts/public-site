<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Department of Second Drafts</title>
    <style>
      :root {
        --color-primary: #222;
        --color-background: #fffdfd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-primary: #fff;
          --color-background: #222;
        }
      }
    </style>
  </head>
  <body
    style="
      line-height: 1.8;
      font-size: 1.2rem;
      color: var(--color-primary);
      background: var(--color-background);
    "
  >
    <main style="max-width: 600px; margin: 4rem auto">
      <h1 style="text-align: center">The Department of Second Drafts</h1>
      <p style="text-wrap: pretty; text-align: justify">
        Welcome! You're one of the very first to have found us. We promise
        there's much more to come for storytellers of all types.
      </p>
      <p style="text-align: right">– The Department</p>
      <picture>
        <source srcset="img/logo.svg" media="(prefers-color-scheme: light)" />
        <source
          srcset="img/logo-white.svg"
          media="(prefers-color-scheme: dark)"
        />
        <img
          src="img/logo.svg"
          alt="The Department of Second Drafts"
          style="width: 100%; max-width: 600px; margin: 0 auto"
        />
      </picture>
    </main>
  </body>
</html>
